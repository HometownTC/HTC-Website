# Publishes scheduled Hometown Brief posts on their date.
# Posts merged early stay hidden until their publishDate (src/utils/isPublished.ts).
# Each morning this checks for a post dated today; if there is one, it adds an
# empty "publish" commit to main, and Cloudflare Pages rebuilds the site.
# No secrets needed. Days with nothing scheduled make no commit.
name: Daily publish

on:
  schedule:
    # GitHub can start scheduled runs hours late, so try three times each morning.
    # A run does nothing if today's posts were already published.
    - cron: '5 10 * * *'   # 5:05 AM Eastern (standard time) / 6:05 AM (daylight)
    - cron: '35 11 * * *'  # 6:35 AM / 7:35 AM
    - cron: '5 13 * * *'   # 8:05 AM / 9:05 AM
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 50
      - name: Rebuild if a post is due today
        run: |
          TODAY=$(TZ=America/New_York date +%F)
          DUE=$(grep -l "^publishDate: \"$TODAY" src/content/blog/*.md | xargs -r grep -L '^draft: true' || true)
          if [ -z "$DUE" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Nothing scheduled for $TODAY"; exit 0
          fi
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && git log --since="$TODAY 00:00" --format=%s | grep -q "^Publish scheduled posts for $TODAY"; then
            echo "Already published for $TODAY"; exit 0
          fi
          echo "Publishing for $TODAY:"; echo "${DUE:-manual run}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Publish scheduled posts for $TODAY"
          git push origin HEAD:main
