# Publishes scheduled Hometown Brief posts on their date.
# Posts merged early stay hidden until their publishDate (src/utils/isPublished.ts).
# Each morning at 9:00 AM Eastern this checks for a post dated today; if there is one, it adds an
# empty "publish" commit to main, and Cloudflare Pages rebuilds the site.
# No secrets needed. Days with nothing scheduled make no commit.
name: Daily publish

on:
  schedule:
    # Posts go live at 9:00 AM Eastern. Cron runs in UTC, so 13:00 and 14:00 UTC
    # cover 9:00 AM in both daylight and standard time; runs before 9:00 AM Eastern
    # exit without publishing. GitHub can start scheduled runs late, so two later
    # tries catch a missed run. A run does nothing if today's posts were already published.
    - cron: '0 13 * * *'   # 9:00 AM Eastern (daylight) / 8:00 AM (standard, exits)
    - cron: '0 14 * * *'   # 9:00 AM Eastern (standard) / 10:00 AM (daylight)
    - cron: '30 14 * * *'  # retry
    - cron: '30 15 * * *'  # retry
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 50
      - name: Rebuild if a post is due today
        run: |
          TODAY=$(TZ=America/New_York date +%F)
          HOUR=$(TZ=America/New_York date +%-H)
          if [ "$HOUR" -lt 9 ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Before 9:00 AM Eastern; waiting for the next run"; exit 0
          fi
          DUE=$(grep -l "^publishDate: \"$TODAY" src/content/blog/*.md | xargs -r grep -L '^draft: true' || true)
          if [ -z "$DUE" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Nothing scheduled for $TODAY"; exit 0
          fi
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && git log --since="$TODAY 00:00" --format=%s | grep -q "^Publish scheduled posts for $TODAY"; then
            echo "Already published for $TODAY"; exit 0
          fi
          echo "Publishing for $TODAY:"; echo "${DUE:-manual run}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Publish scheduled posts for $TODAY"
          git push origin HEAD:main
