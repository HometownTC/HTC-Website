name: Sync to Client Repository

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Client Repository
        env:
          CLIENT_TOKEN: ${{ secrets.CLIENT_SYNC_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote add client "https://x-access-token:${CLIENT_TOKEN}@github.com/HometownTC/HTC-Website.git"
          git push -f client main
