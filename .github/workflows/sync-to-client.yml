name: Sync to Client Repository

on:
  push:
    branches:
      - main

jobs:
  sync:
    if: github.repository == 'muzzamilahmedkhan/Home-Town-Transaction-Coordinator---Muzzamil-Ahmed-Khan'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Client Repository
        env:
          SSH_KEY: ${{ secrets.CLIENT_SSH_KEY }}
        run: |
          if [ -n "$SSH_KEY" ]; then
            mkdir -p ~/.ssh
            echo "$SSH_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            ssh-keyscan github.com >> ~/.ssh/known_hosts
            git remote add client git@github.com:HometownTC/HTC-Website.git
            git push -f client main
          fi
