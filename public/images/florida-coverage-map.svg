<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1412" />
      <stop offset="100%" stop-color="#3A2E29" />
    </linearGradient>
    <linearGradient id="flGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#075960" />
      <stop offset="100%" stop-color="#0D9BA3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="600" rx="16" fill="url(#bgGrad)" />
  <rect width="800" height="600" rx="16" fill="none" stroke="#0D9BA3" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Subtle Coordinate Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="600" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="300" y1="0" x2="300" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="500" y1="0" x2="500" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
    <line x1="700" y1="0" x2="700" y2="600" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="500" x2="800" y2="500" />
  </g>

  <!-- Florida Geographic Silhouette (Vector Path) -->
  <path d="M 120 170 
           L 320 170 
           L 380 185 
           L 460 190 
           L 490 220 
           L 510 270 
           L 540 340 
           L 570 420 
           L 580 480 
           L 560 520 
           L 540 525 
           L 520 490 
           L 480 470 
           L 450 430 
           L 440 370 
           L 410 330 
           L 370 270 
           L 330 240 
           L 240 230 
           L 150 220 
           L 120 170 Z" 
        fill="url(#flGrad)" 
        fill-opacity="0.25" 
        stroke="#20C5D2" 
        stroke-width="2" 
        stroke-linejoin="round" />

  <!-- Florida Keys Island Chain -->
  <path d="M 540 535 L 510 545 L 470 550 L 440 555" 
        fill="none" 
        stroke="#20C5D2" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-dasharray="3 6" />

  <!-- Region 1: South Florida Hub (Miami-Dade / Broward) -->
  <g transform="translate(560, 480)">
    <circle r="22" fill="#FE7311" fill-opacity="0.2" filter="url(#glow)" />
    <circle r="10" fill="#FE7311" fill-opacity="0.4" />
    <circle r="5" fill="#FE7311" />
    <text x="20" y="5" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">SOUTH FLORIDA</text>
    <text x="20" y="20" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#FE7311">Miami-Dade &amp; Broward</text>
  </g>

  <!-- Region 2: Central Florida (Orlando / Orange / Osceola) -->
  <g transform="translate(480, 310)">
    <circle r="18" fill="#20C5D2" fill-opacity="0.2" filter="url(#glow)" />
    <circle r="8" fill="#20C5D2" fill-opacity="0.4" />
    <circle r="4" fill="#20C5D2" />
    <text x="18" y="4" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">CENTRAL FLORIDA</text>
    <text x="18" y="19" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#20C5D2">Orlando &amp; Metro Portal</text>
  </g>

  <!-- Region 3: Gulf Coast & Tampa Bay -->
  <g transform="translate(410, 360)">
    <circle r="18" fill="#20C5D2" fill-opacity="0.2" filter="url(#glow)" />
    <circle r="8" fill="#20C5D2" fill-opacity="0.4" />
    <circle r="4" fill="#20C5D2" />
    <text x="-165" y="4" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">TAMPA BAY / GULF</text>
    <text x="-165" y="19" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#20C5D2">Hillsborough &amp; Pinellas</text>
  </g>

  <!-- Region 4: North Florida & First Coast -->
  <g transform="translate(450, 200)">
    <circle r="16" fill="#20C5D2" fill-opacity="0.2" filter="url(#glow)" />
    <circle r="7" fill="#20C5D2" fill-opacity="0.4" />
    <circle r="3.5" fill="#20C5D2" />
    <text x="16" y="4" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">NORTHEAST FLORIDA</text>
    <text x="16" y="19" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#20C5D2">Duval &amp; St. Johns</text>
  </g>

  <!-- Region 5: Florida Panhandle / Tallahassee -->
  <g transform="translate(230, 200)">
    <circle r="14" fill="#20C5D2" fill-opacity="0.2" filter="url(#glow)" />
    <circle r="6" fill="#20C5D2" fill-opacity="0.4" />
    <circle r="3" fill="#20C5D2" />
    <text x="-120" y="4" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">PANHANDLE</text>
    <text x="-120" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#20C5D2">Leon &amp; Northwest FL</text>
  </g>

  <!-- Title & Legend Header Block -->
  <g transform="translate(35, 45)">
    <rect width="270" height="75" rx="10" fill="#1A1412" fill-opacity="0.8" stroke="#0D9BA3" stroke-width="1" stroke-opacity="0.4" />
    <text x="18" y="28" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#FE7311" letter-spacing="1.5">HOMETOWN TC // COVERAGE</text>
    <text x="18" y="48" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF">Florida Service Footprint</text>
    <text x="18" y="64" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#A09895">All 67 Florida Counties Supported</text>
  </g>

  <!-- Stat Badges in Bottom Left -->
  <g transform="translate(35, 500)">
    <rect width="210" height="60" rx="10" fill="#1A1412" fill-opacity="0.8" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1" />
    <text x="18" y="25" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#20C5D2" letter-spacing="1">STATEWIDE COMPLIANCE</text>
    <text x="18" y="44" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Florida Real Estate Operations</text>
  </g>
</svg>